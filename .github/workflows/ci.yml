name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MariaDB as in docker-compose.yml, and MySQL, whose rules differ (e.g. on generated columns).
          - database: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
          - database: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -u root -pci-root --silent
    name: backend (${{ matrix.database }})
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: ${{ matrix.database }}
        env:
          # A throwaway database that exists only for this job (both images read these).
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: cms_test
          MYSQL_USER: cms
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URI: mysql+pymysql://cms:ci-password@127.0.0.1:3306/cms_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Only baked into the build output; nothing is contacted during CI.
      NEXT_PUBLIC_API_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cms-backend ./backend
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:5000 -t cms-frontend ./frontend
