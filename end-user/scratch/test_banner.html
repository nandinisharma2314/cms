<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #333; padding: 20px; font-family: sans-serif; }
  .dashboard-hero-banner {
    background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
    border-radius: 18px;
    min-height: 165px;
    width: 350px;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    color: white;
  }
  .banner-content { max-width: 58%; position: relative; z-index: 2; }
  .banner-artwork-container.mobile-art {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 160px;
    height: 150px;
    z-index: 1;
  }
  .megaphone-artwork-wrapper { width: 100%; height: 100%; }
  .megaphone-svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="dashboard-hero-banner">
  <div class="banner-content">
    <h2 style="margin:0 0 6px; font-size:20px;">Have an issue<br>in your area?</h2>
    <p style="margin:0 0 14px; font-size:12.5px; color:#dbeafe;">Report it and help us make your community better.</p>
    <button style="background:white; border:none; padding:8px 16px; border-radius:10px; font-weight:700;">+ Register Complaint</button>
  </div>
  <div class="banner-artwork-container mobile-art">
    <div class="megaphone-artwork-wrapper mobile">
      <svg viewBox="0 0 180 160" fill="none" xmlns="http://www.w3.org/2000/svg" class="megaphone-svg">
        <defs>
          <linearGradient id="megaConeGrad" x1="60" y1="30" x2="160" y2="140" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#ffffff" />
            <stop offset="70%" stopColor="#f8fafc" />
            <stop offset="100%" stopColor="#cbd5e1" />
          </linearGradient>
          <linearGradient id="megaBlueGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#2563eb" />
            <stop offset="100%" stopColor="#1e40af" />
          </linearGradient>
        </defs>
        <g class="megaphone-hand-group" transform="translate(10, -5) scale(0.9)">
          <g transform="rotate(22, 110, 85)">
            <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
              <path d="M 22 68 A 24 24 0 0 0 22 102" fill="none" />
              <path d="M 12 56 A 38 38 0 0 0 12 114" fill="none" />
              <path d="M 2 44 A 54 54 0 0 0 2 126" fill="none" />
            </g>
            <rect x="135" y="65" width="28" height="40" rx="10" fill="url(#megaBlueGrad)" />
            <ellipse cx="163" cy="85" rx="6" ry="18" fill="#1e3a8a" />
            <path d="M 140 68 L 50 44 C 44 42 38 48 38 54 L 38 116 C 38 122 44 128 50 126 L 140 102 Z" fill="url(#megaConeGrad)" />
            <ellipse cx="44" cy="85" rx="10" ry="42" fill="url(#megaBlueGrad)" />
            <ellipse cx="42" cy="85" rx="7" ry="38" fill="#1d4ed8" />
            <ellipse cx="40" cy="85" rx="4" ry="30" fill="#1e3a8a" />
            <rect x="115" y="100" width="14" height="42" rx="7" fill="#1e3a8a" />
            <ellipse cx="114" cy="112" rx="7" ry="5" fill="#fed7aa" />
            <rect x="108" y="112" width="22" height="7" rx="3.5" fill="#fde68a" />
            <rect x="107" y="120" width="23" height="7" rx="3.5" fill="#fed7aa" />
            <rect x="107" y="128" width="23" height="7" rx="3.5" fill="#fde68a" />
            <rect x="108" y="136" width="22" height="7" rx="3.5" fill="#fed7aa" />
            <path d="M 100 148 L 132 148 L 136 172 L 96 172 Z" fill="#1e293b" />
            <rect x="98" y="146" width="36" height="5" rx="2" fill="#ffffff" />
          </g>
        </g>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
