# Complaint Management System — Zero-Touch Production & Development Stack
#
# Quickstart:
#   cp .env.example .env
#   docker compose up --build -d
#
# Docker will automatically:
#   1. Start MariaDB and initialize InnoDB.
#   2. Apply all Alembic database migrations to head.
#   3. Bootstrap system roles, permissions, settings, location levels, SLA rules,
#      escalations, rejection reasons, rewards & perks catalog.
#   4. Provision the initial Super Admin account (configurable via SUPERADMIN_EMAIL / SUPERADMIN_PASSWORD).
#   5. Start the FastAPI API server, the background worker, and the Next.js web application.

x-database-uri: &database-uri mysql+pymysql://${DB_USER:-cms}:${DB_PASSWORD:-cmspassword}@db:3306/${DB_NAME:-cms}?charset=utf8mb4

x-api-image: &api-image
  build:
    context: ./backend
  env_file:
    - .env
  environment:
    DATABASE_URI: *database-uri

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-cms}
      MARIADB_USER: ${DB_USER:-cms}
      MARIADB_PASSWORD: ${DB_PASSWORD:-cmspassword}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # Runs migrations and syncs system defaults, then exits; api and worker start only after success.
  migrate:
    <<: *api-image
    command: ["python", "manage.py", "migrate"]
    environment:
      DATABASE_URI: *database-uri
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@kvontech.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-Admin@12345}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URI: *database-uri
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@kvontech.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-Admin@12345}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      WORKER_INTERVAL_SECONDS: "0"
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *api-image
    restart: unless-stopped
    command: ["python", "worker.py"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
