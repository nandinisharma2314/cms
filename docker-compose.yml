# The whole stack: MariaDB, the API, the background worker and both web apps.
#
#   cp .env.example .env                    # database credentials and public URLs
#   cp backend/.env.example backend/.env    # API settings (DATABASE_URI is set here instead)
#   docker compose up --build -d
#   docker compose run --rm api python manage.py create-super-admin --name "..." --email ...
#
# Every variable marked :? must be set in .env; compose refuses to start otherwise.

# The API's database URL points at the db service; it overrides the one in backend/.env.
# A password with URL-special characters (@ : / ? #) must be percent-encoded in .env.
x-database-uri: &database-uri mysql+pymysql://${DB_USER:?set DB_USER in .env}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/${DB_NAME:?set DB_NAME in .env}?charset=utf8mb4

x-api-image: &api-image
  build:
    context: ./backend
  env_file: ./backend/.env
  environment:
    DATABASE_URI: *database-uri

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Creates or upgrades the schema, then exits; the API starts only after it succeeded.
  migrate:
    <<: *api-image
    command: ["python", "manage.py", "migrate"]
    healthcheck:
      disable: true  # the image's check probes the HTTP server, which only the api service runs
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URI: *database-uri
      UPLOAD_DIR: /app/uploads
      # The worker service does the background work; the API process doesn't.
      WORKER_INTERVAL_SECONDS: "0"
    ports:
      - "${API_PORT:?set API_PORT in .env}:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *api-image
    restart: unless-stopped
    command: ["python", "worker.py"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-panel:
    build:
      context: ./admin-panel
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:?set ADMIN_PORT in .env}:3000"
    depends_on:
      api:
        condition: service_healthy

  end-user:
    build:
      context: ./end-user
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env}
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:?set PORTAL_PORT in .env}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  uploads:
